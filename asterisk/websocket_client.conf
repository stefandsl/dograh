; Outbound WebSocket client used by ARI externalMedia.
; The id "dograh-ws" is what we pass as external_host in the
; POST /channels/externalMedia call. Asterisk dials this URL and
; appends ?key=value query params from the `data` field so the api side
; can route to the right workflow run.
;
; connection_type=per_call_config means Asterisk opens a fresh WS
; connection per externalMedia call (vs reusing a persistent one).
; Without ANY connection_type, the section is loaded but never registered
; as a usable client, and external_host=dograh-ws fails with HTTP 500
; "external_host must be a valid websocket_client connection id".
[dograh-ws]
type = websocket_client
connection_type = per_call_config
uri = ws://api:8000/api/v1/telephony/ws/ari
protocols = media
tls_enabled = no
