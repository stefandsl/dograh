; Outbound WebSocket client used by ARI externalMedia.
; The id "dograh-ws" is what we pass as external_host in the
; POST /channels/externalMedia call. Asterisk dials this URL and
; appends ?key=value query params from the v() expression in
; transport_data so the api side can route to the right workflow run.
[dograh-ws]
type = websocket_client
uri = ws://api:8000/api/v1/telephony/ws/ari
protocols = media
connection_type = persistent
reconnect_attempts = -1
reconnect_interval = 1000
tls_enabled = no
