; Dialplan for MessageNet ↔ Dograh bridging via the dograh-messagenet
; Stasis app. The Python-side listener (api/services/telephony/providers/
; messagenet/stasis_listener.py) handles StasisStart by creating an
; externalMedia channel and bridging it to the trunk leg.

[globals]
DOGRAH_STASIS_APP = dograh-messagenet

; --- Inbound: PSTN caller → MessageNet → here -----------------------------
; The MessageNet PJSIP endpoint routes inbound calls into this context.
; We answer, then hand off to Stasis with the dialled extension + caller id
; as appArgs so the listener can resolve DID → workflow.
[dograh-inbound]
exten => _X.,1,NoOp(MessageNet inbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(${DOGRAH_STASIS_APP},direction=inbound,to=${EXTEN},from=${CALLERID(num)})
 same => n,Hangup()

; Catch-all so an unparsed extension still hits Stasis with the raw value.
exten => _.,1,NoOp(MessageNet inbound catch-all from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(${DOGRAH_STASIS_APP},direction=inbound,to=${EXTEN},from=${CALLERID(num)})
 same => n,Hangup()

; --- Outbound: ARI originates a Local channel into this dialer context ----
; The api container calls POST /ari/channels with
;   endpoint = Local/<E.164>@dograh-outbound-dialer/n
;   app      = dograh-messagenet
;   appArgs  = workflow_run_id=<N>
;
; Asterisk creates the Local channel pair. The /n suffix keeps both legs
; alive (no dialplan optimization), which is what we want so the trunk
; channel exists independently of the Stasis-side leg.
;
; - Local-leg-A enters the Stasis app with the workflow_run_id appArg;
;   the listener creates externalMedia and bridges A ↔ externalMedia.
; - Local-leg-B enters this context and runs Dial(PJSIP/<exten>@messagenet),
;   which is what actually places the SIP INVITE. Going through Dial()
;   gets us a properly negotiated SDP with an m=audio line — the previous
;   ARI-originate-direct-into-Stasis path sent a header-only SDP and
;   MessageNet rejected it with HTTP 500.
[dograh-outbound-dialer]
exten => _X.,1,NoOp(Dograh outbound dial via MessageNet to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@messagenet,30)
 same => n,Hangup()
exten => _+X.,1,NoOp(Dograh outbound dial via MessageNet to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@messagenet,30)
 same => n,Hangup()
