; PJSIP transport + MessageNet trunk endpoint.
;
; The trunk-specific credentials (username, password, SIP URI user part)
; live in conf.d/messagenet_local.conf — a gitignored file the operator
; creates from messagenet_local.conf.example. Splitting them out keeps
; real secrets out of the repo.

; --- UDP transport for SIP signalling -------------------------------------
; The entrypoint substitutes __EXTERNAL_IP__ from the EXTERNAL_IP env var
; so SDP / Contact headers carry an address MessageNet can reach for RTP.
; local_net entries cover RFC1918 ranges so traffic between internal
; endpoints (none today, future-proof) doesn't get rewritten.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_signaling_address = __EXTERNAL_IP__
external_media_address = __EXTERNAL_IP__
local_net = 172.16.0.0/12
local_net = 10.0.0.0/8
local_net = 192.168.0.0/16

; --- MessageNet trunk (included from conf.d) ------------------------------
; The local file defines four sections under the name "messagenet":
;   [messagenet] type=registration
;   [messagenet] type=auth
;   [messagenet] type=aor
;   [messagenet] type=endpoint
; See conf.d/messagenet_local.conf.example for the template.
#include "conf.d/messagenet_local.conf"
