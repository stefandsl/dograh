; Minimal module set for Dograh ↔ MessageNet bridging.
; Loaded modules: PJSIP stack, ARI/Stasis, HTTP server, externalMedia, codecs.
[modules]
autoload = no

; Core
load = res_crypto.so
load = res_pjproject.so
load = res_sorcery_config.so
load = res_sorcery_memory.so
load = res_sorcery_astdb.so
load = res_sorcery_realtime.so

; HTTP server (needed for ARI)
load = res_http_websocket.so
load = res_websocket_client.so

; ARI + Stasis
load = res_ari_model.so
load = res_ari.so
load = res_ari_applications.so
load = res_ari_asterisk.so
load = res_ari_bridges.so
load = res_ari_channels.so
load = res_ari_device_states.so
load = res_ari_endpoints.so
load = res_ari_events.so
load = res_ari_playbacks.so
load = res_ari_recordings.so
load = res_ari_sounds.so
load = res_stasis.so
load = res_stasis_answer.so
load = res_stasis_device_state.so
load = res_stasis_playback.so
load = res_stasis_recording.so
load = res_stasis_snoop.so
load = app_stasis.so

; --- RTP engine + PJSIP↔RTP glue --------------------------------------
; res_rtp_asterisk: THE RTP stack. Required by chan_rtp, chan_pjsip
; (for media), and the PJSIP SDP generator. Without it, the SDP module
; below silently fails to register audio formats and outbound INVITEs
; carry a header-only SDP (no m=audio line) — MessageNet and most
; carriers reject those with HTTP 500.
load = res_rtp_asterisk.so
load = res_rtp_multicast.so  ; chan_rtp's hard dependency
; res_pjsip_sdp_rtp: the module that generates the m=audio line and RTP
; port allocation in PJSIP-originated SDP offers/answers. Missing this
; was the root cause of the "no m= line" outbound INVITE bug.
load = res_pjsip_sdp_rtp.so

; PJSIP signalling + media
load = res_pjsip.so
load = res_pjsip_session.so
load = res_pjsip_authenticator_digest.so
load = res_pjsip_endpoint_identifier_ip.so
load = res_pjsip_endpoint_identifier_user.so
load = res_pjsip_endpoint_identifier_anonymous.so
load = res_pjsip_outbound_registration.so
load = res_pjsip_outbound_authenticator_digest.so
load = res_pjsip_caller_id.so
load = res_pjsip_send_to_voicemail.so
load = res_pjsip_acl.so
load = res_pjsip_logger.so
load = res_pjsip_messaging.so
load = res_pjsip_t38.so
load = res_pjsip_transport_websocket.so
load = chan_pjsip.so

; External media (for chan_websocket-style audio leg back to Dograh)
load = res_pjsip_pubsub.so
load = res_format_attr_g729.so
load = format_g729.so

; Codecs
load = codec_ulaw.so
load = codec_alaw.so
load = codec_gsm.so
load = codec_g722.so
load = codec_resample.so
load = format_pcm.so
load = format_wav.so
load = format_sln.so

; Bridging
load = bridge_simple.so
load = bridge_native_rtp.so
load = bridge_softmix.so
load = bridge_holding.so

; Dialplan loader (reads extensions.conf)
load = pbx_config.so

; Channel drivers — Local is in core. chan_websocket carries the audio
; payload for externalMedia (when transport=websocket). chan_rtp provides
; the UnicastRTP channel type that ARI externalMedia allocates as the
; channel container — without it, POST /channels/externalMedia fails
; with HTTP 500 and `No channel type registered for 'UnicastRTP'` in
; /var/log/asterisk/messages.
load = chan_websocket.so
load = chan_rtp.so
; AudioSocket externalMedia transport (probe — chan_websocket externalMedia
; silently 500s in this image build, see docs troubleshooting).
load = res_audiosocket.so
load = chan_audiosocket.so

; Apps
load = app_dial.so
load = app_echo.so
load = app_playback.so
load = app_verbose.so
load = app_originate.so
load = app_userevent.so
load = app_chanisavail.so

; Functions
load = func_callerid.so
load = func_strings.so
load = func_logic.so
load = func_channel.so
load = func_pjsip_endpoint.so
load = func_global.so
