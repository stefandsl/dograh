[directories]
; The container entrypoint copies our config tree into /etc/asterisk-runtime
; before starting Asterisk with -C /etc/asterisk-runtime/asterisk.conf.
; astetcdir points at the runtime dir so pjsip.conf / extensions.conf /
; modules.conf are also loaded from our copy — without this Asterisk
; silently falls back to the image's default /etc/asterisk tree.
astetcdir => /etc/asterisk-runtime
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
nofork = yes
documentation_language = en_US
hideconnect = yes
lockmode = flock
