; ARI (Asterisk REST Interface) configuration.
; The Dograh api container authenticates here with basic auth using
; ARI_USER / ARI_PASSWORD from .env. Keep the password out of this file
; by reading it from the environment at container start (entrypoint
; substitutes the placeholder below).
[general]
enabled = yes
pretty = yes
allowed_origins = *

[dograh]
type = user
read_only = no
password = __ARI_PASSWORD__
password_format = plain
